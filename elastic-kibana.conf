 SungeroElasticSearch:
        port: 9200
        # Port for the node-to-node interaction.
        port_tcp: 9300
        # Elasticsearch docker tag. If the parameter is not set, the default value is 'registry.directum.ru/public/elasticsearch:7.17.23'.
        docker_tag: 'docker.elastic.co/elasticsearch/elasticsearch:7.17.23'
        es_data_path: '{{ home_path }}/elasticsearch/data'
        # Path to the synonyms file. If the file does not exist or the path is not specified, the file will be generated automatically.
        synonyms_file_path: '{{ home_path }}/elasticsearch/synonyms.txt'
        environments:
            # Elasticsearch node name used to identify a node in the cluster.
            ES_SETTING_NODE_NAME: 'es01'
            # Cluster name used to identify the cluster. The name must be the same for all nodes in the cluster.
            ES_SETTING_CLUSTER_NAME: 'es_cluster'
            # List of Elasticsearch nodes that can become master nodes when the cluster is first started.
            ES_SETTING_CLUSTER_INITIAL__MASTER__NODES: 'es01'
    SungeroKibana:
        port: 5601
        # Kibana docker tag. If the parameter is not set, the default value is 'registry.directum.ru/public/kibana:7.17.23'.
        docker_tag: 'docker.elastic.co/kibana/kibana:7.17.23'
        kibana_data_path: '{{ home_path }}/kibana/data'
        environments:
            # Public URL of Kibana.
            SERVER_PUBLICBASEURL: 'http://{{ host_fqdn }}:5601'
            # A list of Elasticsearch node addresses that Kibana will connect to.
            ELASTICSEARCH_HOSTS:
            -   'http://{{ host_fqdn }}:9200'

sudo chown -R 1000:0 /opt/monitoring/dir-data
sudo chmod -R g+rwx /opt/monitoring/dir-data

curl -fLO https://artifacts.elastic.co/downloads/elasticsearch-plugins/analysis-icu/analysis-icu-7.17.23.zip
curl -fLO https://artifacts.elastic.co/downloads/elasticsearch-plugins/ingest-attachment/ingest-attachment-7.17.23.zip

# 1. Скопировать в контейнер
docker cp analysis-icu-7.17.23.zip sungeroelasticsearch:/tmp/
docker cp ingest-attachment-7.17.23.zip sungeroelasticsearch:/tmp/

# 2. Установить
docker exec -it sungeroelasticsearch bin/elasticsearch-plugin install --batch file:///tmp/analysis-icu-7.17.23.zip
docker exec -it sungeroelasticsearch bin/elasticsearch-plugin install --batch file:///tmp/ingest-attachment-7.17.23.zip

# 3. Перезапустить, чтобы ES подхватил плагины
docker restart sungeroelasticsearch

# 4. Проверить
docker exec -it sungeroelasticsearch bin/elasticsearch-plugin list

docker exec -it -u root sungeroelasticsearch bin/elasticsearch-plugin install --batch file:///tmp/analysis-icu-7.17.23.zip
docker exec -it -u root sungeroelasticsearch chown -R 1000:0 /usr/share/elasticsearch/plugins

git clone https://github.com/nickyat/elasticsearch-analysis-morphology.git
cd elasticsearch-analysis-morphology
git checkout fd10f2b      # версия плагина под ES 7.16.3

# меняем версию на вашу
sed -i 's#<elasticsearch.version>7.16.3</elasticsearch.version>#<elasticsearch.version>7.17.23</elasticsearch.version>#' pom.xml

# собираем в контейнере Maven (Java и Maven ставить не нужно)
PHOST=10.10.1.5
PPORT=3128
docker run --rm --network host -v "$PWD":/src -w /src \
  -e MAVEN_OPTS="-Dhttp.proxyHost=$PHOST -Dhttp.proxyPort=$PPORT -Dhttps.proxyHost=$PHOST -Dhttps.proxyPort=$PPORT" \
  maven:3.8-openjdk-11 mvn clean package -Dmaven.test.skip=true

ls target/releases/

docker cp target/releases/elasticsearch-analysis-morphology-7.17.23.zip sungeroelasticsearch:/tmp/
docker exec -it sungeroelasticsearch bin/elasticsearch-plugin install --batch \
  file:///tmp/elasticsearch-analysis-morphology-7.17.23.zip
docker restart sungeroelasticsearch

docker exec -it sungeroelasticsearch bin/elasticsearch-plugin list

curl -X POST http://localhost:9200/_analyze -H 'Content-Type: application/json' \
  -d '{"analyzer":"russian_morphology","text":"документы согласованы"}'
